name: Deploy Space Shooter to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install pygbag pygame

      - name: Compile Game to Static WebAssembly
        run: |
          python - << 'PYEOF'
          import sys
          from pathlib import Path
          import pygbag.__main__ as pygbag_main

          # Hedef klasörü ayarla
          target_app = Path("game").resolve()
          
          # Parametreleri belirle ve derleme motorunu tetikle
          sys.argv = ["pygbag", "--build", str(target_app)]
          try:
              pygbag_main.main()
          except SystemExit as e:
              # Normal sonlanmayı kabul et
              if e.code not in (0, None):
                  raise
          PYEOF

          # Çıktı dizinini doğrula ve build/web klasörüne taşı
          mkdir -p build/web
          if [ -d "game/build/web" ]; then
            cp -r game/build/web/* build/web/
          elif [ -d "build/web" ]; then
            echo "build/web directory ready."
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
