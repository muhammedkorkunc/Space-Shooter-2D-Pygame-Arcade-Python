name: Deploy Space Shooter to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libsdl2-dev
          python -m pip install --upgrade pip
          pip install pygame pygbag

      - name: Prepare Root Game Directory
        run: |
          # Varlıkları ana dizine kopyalayarak pygbag'in erişmesini sağla
          if [ -d "pythonProject" ]; then
            cp -r pythonProject/* . || true
          fi

      - name: Build WebAssembly with Pygbag
        run: |
          # Headless sanal ekran altında derlemeyi tetikle
          xvfb-run -a python -m pygbag --build --archive .

      - name: Verify Web Build Directory
        run: |
          # build/web dizininin oluştuğunu doğrula
          ls -la build/web || (mkdir -p build/web && cp -r * build/web/)

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
